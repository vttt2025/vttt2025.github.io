<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" aria-hidden="true">
  <!--
    Matryoshka doll SVG - Đậu TRKI
    Tự vẽ vector, không phụ thuộc link ngoài, dùng được cho logo & trang trí.
    Bảng màu phù hợp theme hồng + accent Nga.
  -->
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B9D"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="scarfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Bóng đổ nhẹ dưới chân -->
  <ellipse cx="60" cy="153" rx="28" ry="4" fill="rgba(0,0,0,.12)"/>

  <!-- Thân dưới (bo tròn, eo nhỏ) -->
  <path d="M30 90
           Q30 145 60 150
           Q90 145 90 90
           Z"
        fill="url(#bodyGrad)"/>

  <!-- Thân trên (đầu tròn) -->
  <ellipse cx="60" cy="68" rx="28" ry="32" fill="url(#bodyGrad)"/>

  <!-- Khăn trùm đầu (platok) - màu đỏ Nga -->
  <path d="M30 60
           Q30 28 60 28
           Q90 28 90 60
           L86 64
           Q86 36 60 36
           Q34 36 34 64
           Z"
        fill="url(#scarfGrad)"/>

  <!-- Cà vạt khăn (nơ nhỏ dưới cằm) -->
  <ellipse cx="60" cy="80" rx="6" ry="3" fill="#FBBF24"/>
  <circle cx="60" cy="80" r="2.5" fill="#DC2626"/>

  <!-- Mặt (vùng da) -->
  <ellipse cx="60" cy="62" rx="20" ry="22" fill="#FFE0D0"/>

  <!-- Mắt -->
  <ellipse cx="51" cy="60" rx="2.2" ry="2.6" fill="#1F2937"/>
  <ellipse cx="69" cy="60" rx="2.2" ry="2.6" fill="#1F2937"/>
  <circle cx="51.5" cy="59" r="0.7" fill="#fff"/>
  <circle cx="69.5" cy="59" r="0.7" fill="#fff"/>

  <!-- Má hồng -->
  <circle cx="46" cy="66" r="2.5" fill="#FCA5A5" opacity=".7"/>
  <circle cx="74" cy="66" r="2.5" fill="#FCA5A5" opacity=".7"/>

  <!-- Miệng cười -->
  <path d="M55 70 Q60 74 65 70" stroke="#7C2D12" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- Hoa văn trang trí trên thân (bông hoa đơn giản) -->
  <g fill="#FBBF24" opacity=".85">
    <circle cx="45" cy="110" r="2.5"/>
    <circle cx="75" cy="105" r="2"/>
    <circle cx="60" cy="125" r="2.8"/>
  </g>
  <g fill="#fff" opacity=".7">
    <circle cx="45" cy="110" r="1"/>
    <circle cx="75" cy="105" r=".8"/>
    <circle cx="60" cy="125" r="1.2"/>
  </g>

  <!-- Viền vàng quanh eo -->
  <ellipse cx="60" cy="90" rx="30" ry="2" fill="#FBBF24" opacity=".5"/>
</svg>
