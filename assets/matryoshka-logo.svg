<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-hidden="true">
  <!-- Matryoshka compact cho logo header (vuông, hiển thị rõ ở 36-40px) -->
  <defs>
    <linearGradient id="lg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B9D"/>
      <stop offset="1" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="lg-scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DC2626"/>
      <stop offset="1" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>
  <!-- Khăn trùm đầu (phía sau) -->
  <path d="M10 30 Q10 6 32 6 Q54 6 54 30 L48 33 Q48 13 32 13 Q16 13 16 33 Z" fill="url(#lg-scarf)"/>
  <!-- Mặt -->
  <ellipse cx="32" cy="32" rx="20" ry="22" fill="#FFE0D0"/>
  <!-- Mắt -->
  <ellipse cx="24" cy="30" rx="2.4" ry="2.8" fill="#1F2937"/>
  <ellipse cx="40" cy="30" rx="2.4" ry="2.8" fill="#1F2937"/>
  <circle cx="24.6" cy="29" r="0.8" fill="#fff"/>
  <circle cx="40.6" cy="29" r="0.8" fill="#fff"/>
  <!-- Má hồng -->
  <circle cx="19" cy="36" r="3" fill="#FCA5A5" opacity=".7"/>
  <circle cx="45" cy="36" r="3" fill="#FCA5A5" opacity=".7"/>
  <!-- Miệng cười -->
  <path d="M26 41 Q32 46 38 41" stroke="#7C2D12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- Khăn quàng cổ (phía dưới) -->
  <path d="M14 50 Q32 58 50 50 L52 56 Q32 64 12 56 Z" fill="url(#lg-scarf)"/>
  <!-- Nơ vàng -->
  <ellipse cx="32" cy="52" rx="4" ry="2" fill="#FBBF24"/>
  <circle cx="32" cy="52" r="1.6" fill="#DC2626"/>
</svg>
