# Tự động xuất bản nội dung admin sửa trên Supabase lên website (data/modules/*.json).
# Kích hoạt: trigger Supabase gửi repository_dispatch "content-changed" (xem
# supabase/migrations/20261125090000_content_publish_trigger.sql), hoặc chạy tay trên tab Actions.
name: Publish content

on:
  repository_dispatch:
    types: [content-changed]
  workflow_dispatch:
    inputs:
      all:
        description: "Tạo lại toàn bộ module (bỏ qua so sánh bộ đếm)"
        type: boolean
        default: false

# Gộp các lần lưu liên tiếp: chỉ một lần chạy cùng lúc + một lần chờ (lần chờ mới thay lần chờ cũ).
# Không huỷ lần đang chạy: huỷ giữa chừng sau khi đã push nhưng trước bước "Yêu cầu GitHub Pages build lại"
# thì lần sau không thấy thay đổi → không gọi build → web giữ bản cũ.
concurrency:
  group: publish-content
  cancel-in-progress: false

permissions:
  contents: write
  pages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Chờ admin lưu xong (gộp nhiều lần lưu)
        if: github.event_name == 'repository_dispatch'
        run: sleep 90

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tạo lại module đã thay đổi
        run: node scripts/publish-content.js ${{ inputs.all && '--all' || '' }}

      - name: Kiểm tra Zero-Answer Leak & cú pháp
        run: npm test

      - name: Commit & push
        id: commit
        run: |
          # git status --porcelain: tính cả file module mới (untracked), git diff thì không
          if [ -z "$(git status --porcelain -- data/modules)" ]; then
            echo "Không có thay đổi nội dung."
            exit 0
          fi
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          git config user.name "rusi-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_modules() {
            git add data/modules
            git commit -m "chore(content): publish $(git diff --cached --name-only | xargs -n1 basename | tr '\n' ' ')"
          }
          commit_modules
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else
              # Xung đột (vd. lần chạy khác vừa đẩy manifest): huỷ rebase, lấy bản mới nhất rồi tạo lại module
              git rebase --abort || true
              git fetch origin "${GITHUB_REF_NAME}"
              git reset --hard "origin/${GITHUB_REF_NAME}"
              node scripts/publish-content.js ${{ inputs.all && '--all' || '' }}
              npm test
              if [ -z "$(git status --porcelain -- data/modules)" ]; then
                echo "Bản mới nhất đã có nội dung này."
                exit 0
              fi
              commit_modules
            fi
            sleep 5
          done
          exit 1

      # Push bằng GITHUB_TOKEN có thể không tự kích hoạt Pages (chế độ "Deploy from a branch"): yêu cầu build.
      - name: Yêu cầu GitHub Pages build lại
        if: steps.commit.outputs.pushed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
