<body data-page="blog">
  <div id="app-header"></div>

  <main class="bpost-container">
    <div id="postDetailHost">
      <div style="text-align:center;padding:60px 20px;color:var(--muted)">
        <div style="margin-bottom:12px;color:var(--primary)"><rusi-icon name="timer-clock" size="36"></rusi-icon></div>
        Đang tải nội dung bài viết...

  <div id="app-footer"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js" integrity="sha384-2zrRDgDHSYB/GN3nFW3fsZXoxEhKIr3N2h63Tc6DEOB9JJdFIu8xMJT2Cph/gBil" crossorigin="anonymous" defer></script>

  <script src="pomodoro.js?v=7.1" defer></script>
  <script>
    function renderMarkdownContent(text) {
      if (!text) return "";
      if (window.RusiMarkdown && typeof window.RusiMarkdown.render === "function") {
        return `<div class="rusi-md-rendered">${window.RusiMarkdown.render(text)}</div>`;
      }
      const lines = text.split("\n");
      let html = "";
      let inList = false;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (!line) {
          if (inList) { html += "</ul>\n"; inList = false; }
          continue;
        }

        // Headers
        if (line.startsWith("### ")) {
          if (inList) { html += "</ul>\n"; inList = false; }
          html += `<h3>${formatInline(line.slice(4))}</h3>\n`;
          continue;
        }
        if (line.startsWith("## ")) {
          if (inList) { html += "</ul>\n"; inList = false; }
          html += `<h2>${formatInline(line.slice(3))}</h2>\n`;
          continue;
        }
        if (line.startsWith("# ")) {
          if (inList) { html += "</ul>\n"; inList = false; }
          html += `<h2>${formatInline(line.slice(2))}</h2>\n`;
          continue;
        }

        // Blockquotes
        if (line.startsWith("> ")) {
          if (inList) { html += "</ul>\n"; inList = false; }
          html += `<blockquote>${formatInline(line.slice(2))}</blockquote>\n`;
          continue;
        }

        // Unordered lists
        if (line.startsWith("- ") || line.startsWith("* ") || line.startsWith("• ")) {
          if (!inList) { html += "<ul>\n"; inList = true; }
          html += `<li>${formatInline(line.slice(2))}</li>\n`;
          continue;
        }

        if (inList) { html += "</ul>\n"; inList = false; }
        html += `<p>${formatInline(line)}</p>\n`;
      }
      if (inList) html += "</ul>\n";
      return html;
    }

    function safeEsc(str) {
      if (typeof esc === "function") return esc(str);
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function safeMediaUrl(url, fallback) {
      const raw = String(url || "").trim();
      if (!raw) return fallback || "";
      if (/^(https?:\/\/|assets\/|\/(?!\/))/i.test(raw)) return raw;
      return fallback || "";
    }

    function formatInline(str) {
      return safeEsc(str)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/[«“](.*?)[»”]/g, '<span style="color:var(--primary);font-weight:600">“$1”</span>');
    }

    async function initBlogPostPage() {
      const host = document.getElementById("postDetailHost");
      if (!host) return;

      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug") || params.get("id");
      const isPreview = params.get("preview") === "1";

      // 1. Kiểm tra bản nháp xem trước thời gian thực từ CMS (sessionStorage / localStorage)
      let previewDoc = null;
      try {
        const rawPreview = sessionStorage.getItem("rusi_live_preview_draft") || localStorage.getItem("rusi_live_preview_draft");
        if (rawPreview) {
          const parsed = JSON.parse(rawPreview);
          if (parsed && parsed.slug === "BLOG_POSTS" && (parsed.docId === slug || !slug || isPreview)) {
            previewDoc = parsed.doc;
          }
        }
      } catch (_) {}

      if (!previewDoc) {
        try {
          const ad = JSON.parse(localStorage.getItem("trki_admin_data") || "{}");
          const adminBlog = ad.BLOG_POSTS || [];
          const found = adminBlog.find(p => p.slug === slug || p.id === slug);
          if (found) previewDoc = found;
        } catch (_) {}
      }

      // 2. Lấy dữ liệu từ bộ nhớ đệm hoặc Supabase
      const cached = (window.RusiSupabase && window.RusiSupabase.cache) ? window.RusiSupabase.cache.get("blog:all") : null;
      let posts = (cached && cached.length) ? cached : [];

      if ((!window.BLOG_POSTS || !window.BLOG_POSTS.length) && window.RusiSupabase && typeof window.RusiSupabase.blog?.getAll === "function") {
        try {
          const remote = await window.RusiSupabase.blog.getAll();
          if (remote && remote.length) posts = remote;
        } catch (_) {}
      }

      // 3. Fallback Graceful Degradation: Sử dụng BLOG_POSTS cục bộ nếu offline hoặc Supabase rỗng
      if ((!posts || !posts.length) && typeof window.BLOG_POSTS !== "undefined" && Array.isArray(window.BLOG_POSTS)) {
        posts = window.BLOG_POSTS.slice();
      }

      const post = previewDoc || posts.find(p => p.slug === slug || p.id === slug || String(posts.indexOf(p)) === slug) || (!slug ? posts[0] : null);

      if (!post) {
        host.innerHTML = `
          <div style="text-align:center;padding:60px 20px">
            <h2>Không tìm thấy bài viết</h2>
            <p style="color:var(--muted);margin-bottom:20px">Bài viết bạn đang tìm kiếm không tồn tại hoặc đã được chuyển sang đường dẫn khác.</p>
            <a href="blog.html" class="btn btn-primary">← Về trang Blog</a>
          </div>
        `;
        return;
      }

      document.title = (previewDoc ? "[XEM TRƯỚC] " : "") + post.title + " — RUSI TRKI";

      const relatedPosts = posts.filter(p => p !== post && (p.slug !== post.slug)).slice(0, 2);
      const safePostCover = safeMediaUrl(post.cover, "");

      host.innerHTML = `
        <div class="bpost-nav-bar">
          <a href="blog.html" class="rusi-back-btn" style="text-decoration:none">
            ${window.RusiIcons ? RusiIcons.get("arrow-left", { size: 16 }) : ""} <span class="btn-text">Quay lại danh sách bài viết</span>
          </a>
          <button type="button" class="btn btn-soft btn-sm" id="btnSharePost" style="display:flex;align-items:center;gap:6px">
            ${window.RusiIcons ? RusiIcons.get("copy-clipboard", { size: 14 }) : ""} <span class="btn-text">Chia sẻ bài viết</span>
          </button>
        </div>

        ${previewDoc ? `
          <div class="topic-preview-badge-row" style="margin-bottom:20px">
            <span style="font-size:1.2rem">👁️</span>
            <div>
              <strong>Chế độ Xem Trước Thời Gian Thực (Live Preview Studio)</strong>
              <div style="font-size:0.8rem;opacity:0.9;font-weight:400">Đang hiển thị bản nháp Markdown từ CMS RUSI TRKI. Nhấn "Lưu &amp; Đồng bộ Cloud" trong CMS để cập nhật vĩnh viễn lên Supabase.</div>
            </div>
          </div>
        ` : ""}

        <article class="bpost-article">
          <div class="bpost-header">
            <span class="rusi-badge rusi-badge-b1" style="font-weight:700">
              ${safeEsc(post.categoryName || "CẨM NANG DU HỌC NGA")}
            </span>
            <h1 class="bpost-title">${safeEsc(post.title)}</h1>
            <div class="bpost-meta-row">
              <span><b>Tác giả:</b> ${safeEsc(post.author || "RUSI Editorial Team")}</span>
              <span>•</span>
              <span><b>Ngày đăng:</b> ${safeEsc(post.date || "Tháng 8, 2026")}</span>
              <span>•</span>
              <span><b>Thời gian đọc:</b> ${safeEsc(post.readTime || "5 phút đọc")}</span>
            </div>
          </div>

          ${safePostCover ? `<img src="${safeEsc(safePostCover)}" class="bpost-cover" alt="${safeEsc(post.title)}" />` : ""}

          <div class="bpost-body">
            ${renderMarkdownContent(post.content || post.excerpt)}
          </div>

          <!-- AUTHOR BOX -->
          <div style="margin-top:40px;padding:24px;background:#f8fafc;border-radius:14px;border:1px solid #e2e8f0;display:flex;gap:18px;align-items:center">
            <div style="width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,#c52233,#1757a6);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:800;flex-shrink:0">
              Я
            </div>
            <div>
              <div style="font-weight:800;font-size:1.05rem;color:#0f172a;margin-bottom:4px">Ban Biên Tập Học Thuật RUSI TRKI</div>
              <p style="margin:0;font-size:0.88rem;color:#64748b;line-height:1.5">
                Chuyên trang chia sẻ kiến thức chuẩn mực về kỳ thi chứng chỉ quốc tế ТРКИ, kinh nghiệm chuẩn bị hồ sơ du học và đời sống sinh viên tại Liên bang Nga.
              </p>
            </div>
          </div>
        </article>

        <!-- RELATED POSTS -->
        ${relatedPosts.length ? `
          <section style="margin-top:48px">
            <h3 style="font-size:1.35rem;font-weight:800;color:#0f172a;margin-bottom:20px">
              ${window.RusiIcons ? RusiIcons.get("book-open-blog", { size: 20 }) : ""} Bài viết cùng chuyên mục
            </h3>
            <div class="shop-grid">
              ${relatedPosts.map(p => {
                const pSlug = String(p.slug || p.id || "");
                const pCover = safeMediaUrl(p.cover, "assets/red-square.jpg");
                return `
                <article class="product-card blog-card" data-slug="${safeEsc(pSlug)}" style="cursor:pointer">
                  <div class="product-img-wrap">
                    <img src="${safeEsc(pCover)}" class="product-img" alt="${safeEsc(p.title)}" />
                    <span class="product-badge">${safeEsc(p.categoryName || "Du học")}</span>
                  </div>
                  <div class="product-body">
                    <div class="product-cat">${safeEsc(p.date || "")} · ${safeEsc(p.readTime || "5 phút đọc")}</div>
                    <h3 class="product-title" style="font-size:1.05rem">
                      <a href="blog-post.html?slug=${encodeURIComponent(pSlug)}" style="color:inherit;text-decoration:none">${safeEsc(p.title)}</a>
                    </h3>
                    <p class="product-desc">${safeEsc(p.excerpt || "")}</p>
                    <a href="blog-post.html?slug=${encodeURIComponent(pSlug)}" class="btn btn-primary btn-sm btn-read-post" style="margin-top:auto;text-decoration:none">
                      Đọc bài viết →
                    </a>
                  </div>
                </article>
              `;
              }).join("")}
            </div>
          </section>
        ` : ""}
      `;

      // Related post card click delegation
      host.querySelectorAll(".blog-card[data-slug]").forEach((card) => {
        card.addEventListener("click", (e) => {
          if (e.target && e.target.closest("a")) return;
          const targetSlug = card.getAttribute("data-slug");
          if (targetSlug) {
            window.location.href = "blog-post.html?slug=" + encodeURIComponent(targetSlug);
          }
        });
      });

      // Share button copy link
      const btnShare = document.getElementById("btnSharePost");
      if (btnShare) {
        btnShare.onclick = () => {
          navigator.clipboard.writeText(window.location.href).then(() => {
            btnShare.innerHTML = `${window.RusiIcons ? RusiIcons.get("check", { size: 14 }) : ""} Đã chép liên kết!`;
            setTimeout(() => {
              btnShare.innerHTML = `${window.RusiIcons ? RusiIcons.get("copy-clipboard", { size: 14 }) : ""} Chia sẻ bài viết`;
            }, 2500);
          }).catch(() => {
            alert("Đã sao chép liên kết bài viết: " + window.location.href);
          });
        };
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      window.initPage = function initPage() {
        initBlogPostPage();
      };
      if (window.triggerPageInit) {
        window.triggerPageInit();
      }
    });
  </script>
