<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Từ điển Nga — Việt · Mishka TRKI</title>
  <meta name="description" content="Từ điển Nga — Việt đầy đủ cho người học TRKI: tra từ, nghe phát âm, xem ví dụ và thêm vào hàng đợi học từ vựng theo thuật toán lặp lại ngắt quãng." />
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/svg+xml" href="assets/mishka-logo.svg" />
</head>
<body data-page="dictionary">
  <div id="app-header"></div>

  <!-- HERO + SEARCH -->
  <section class="dict-hero">
    <div class="container">
      <span class="dict-tag" id="dictTag">📖 Từ điển Nga — Việt</span>
      <h1 id="dictTitle">Tra cứu <span class="hl">từ vựng tiếng Nga</span></h1>
      <p class="dict-sub">Hơn <b id="dictTotal">172.000</b> từ hai chiều <b>Nga — Việt</b> và <b>Việt — Nga</b> — nghe phát âm, xem ví dụ, thêm vào hàng đợi học từ vựng bằng 1 cú nhấp.</p>

      <div class="dict-tabs" role="tablist">
        <button class="dict-tab active" id="dirRuVi" data-dir="ru-vi">🇷🇺 Nga → Việt</button>
        <button class="dict-tab" id="dirViRu" data-dir="vi-ru">🇻🇳 Việt → Nga</button>
      </div>

      <div class="dict-search-wrap">
        <span class="dict-search-icon">🔍</span>
        <input id="dictSearch" type="search" placeholder="Tìm tiếng Nga hoặc tiếng Việt..." autocomplete="off" />
        <button class="dict-clear" id="dictClear" aria-label="Xóa">×</button>
      </div>

      <div class="dict-hero-stats">
        <div><b id="statTotal">0</b><span>Tổng từ</span></div>
        <div><b id="statMastered">0</b><span>Đã thuộc</span></div>
        <div><b id="statLearning">0</b><span>Đang học</span></div>
        <div><b id="statQueue">0</b><span>Tới hạn ôn</span></div>
      </div>
    </div>
  </section>

  <main class="container" style="padding-bottom:60px">
    <!-- FILTER CHIPS -->
    <div class="dict-filter-bar">
      <div class="dict-filter-group" id="levelFilterGroup">
        <span class="filter-label">Cấp độ:</span>
        <button class="chip chip-level active" data-l="all">Tất cả</button>
        <button class="chip chip-level lvl-A1" data-l="A1">A1</button>
        <button class="chip chip-level lvl-A2" data-l="A2">A2</button>
        <button class="chip chip-level lvl-B1" data-l="B1">B1</button>
        <button class="chip chip-level lvl-B2" data-l="B2">B2</button>
        <button class="chip chip-level lvl-C1" data-l="C1">C1</button>
      </div>
      <div class="dict-filter-group">
        <span class="filter-label">Loại:</span>
        <button class="chip chip-pos active" data-p="all">Tất cả</button>
        <button class="chip chip-pos" data-p="danh từ">Danh từ</button>
        <button class="chip chip-pos" data-p="động từ">Động từ</button>
        <button class="chip chip-pos" data-p="tính từ">Tính từ</button>
        <button class="chip chip-pos" data-p="phó từ">Phó từ</button>
        <button class="chip chip-pos" data-p="giới từ">Giới từ</button>
      </div>
      <div class="dict-filter-group">
        <span class="filter-label">Trạng thái:</span>
        <button class="chip chip-status active" data-s="all">Tất cả</button>
        <button class="chip chip-status" data-s="unseen">Mới</button>
        <button class="chip chip-status" data-s="learning">Đang học</button>
        <button class="chip chip-status" data-s="mastered">Đã thuộc</button>
      </div>
    </div>

    <!-- WORD LIST -->
    <div id="dictList" class="dict-grid"></div>

    <div class="dict-pagination">
      <button class="btn btn-soft" id="dictPrev">← Trước</button>
      <span id="dictPageInfo">Trang 1 / 1</span>
      <input id="dictJump" type="number" min="1" value="1" aria-label="Đến trang" />
      <button class="btn btn-soft" id="dictNext">Sau →</button>
    </div>
  </main>

  <!-- WORD DETAIL MODAL -->
  <div id="dictModal" class="dict-modal hidden" aria-hidden="true">
    <div class="dict-modal-backdrop" id="dictModalBackdrop"></div>
    <div class="dict-modal-card">
      <button class="dict-modal-close" id="dictModalClose" aria-label="Đóng">×</button>
      <div id="dictModalBody"></div>
    </div>
  </div>

  <div id="app-footer"></div>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="data.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
  <script src="srs.js"></script>
  <script src="dict-data.js"></script>
  <script src="pages.js"></script>
  <script>
    function initPage() { initDictPage(); }
  </script>
</body>
</html>
